<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="브라우저에서 바로 돌려보는 온라인 3x3x3 큐브 시뮬레이터">
    <title>3x3x3 큐브 시뮬레이터</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">
                <strong>Cube Sim</strong>
                <span>xiaohuasheng105</span>
            </a>
            <a class="github-link" href="https://github.com/xiaohuasheng105" target="_blank" rel="noopener">GitHub</a>
        </div>
    </header>

    <main class="stage">
        <div id="cube-canvas" class="cube-canvas"></div>

        <div class="hud hud-controls">
            <button id="btn-scramble" class="btn btn-primary" type="button">스크램블</button>
            <button id="btn-reset" class="btn" type="button">리셋</button>
            <button id="btn-view" class="btn" type="button">시점 초기화</button>
        </div>

        <p class="hint" id="hint">큐브 조각을 드래그하면 해당 면이 돌아가고, 배경을 드래그하면 시점이 회전합니다.</p>
        <p class="solved-banner" id="solved-banner" hidden>완성! 🎉</p>
    </main>

    <footer>
        <p>© 2026 xiaohuasheng105</p>
    </footer>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
